# The package list of wdnwebui — one package per line, two columns:
#
#   <pip package name / directory name>   <GitHub repository name>
#
# The first column is at the same time:
#   * the directory name it is cloned into:
#     ~/.wardner/wdnwebui/.venv/src/<first column>/
#   * the name of the dist-info that pip installs (the canonical name of
#     wdnapps-video-analyzer uses hyphens, but what actually lands in
#     site-packages uses underscores — purge_install_traces globs on this
#     column, and passing the hyphenated name makes the cleanup silently
#     miss)
#
# The order matters: the SDKs come first, the card plugins after them.
# The usb_hid card of wdnapps_hdmi_processor imports wdnhid / wdnav, so
# installing the plugins only after those exist keeps the errors in the log
# from pointing at "an SDK that is not installed yet" — a false lead.
#
# Adding a package = add a line here + create a repo of the same name on
# GitHub.

wdnav                   wdnav
wdnai                   wdnai
wdndds                  wdndds
wdnhid                  wdnhid
wdnapps_video_analyzer  wdnapps_video_analyzer
wdnapps_hdmi_processor  wdnapps_hdmi_processor
wdnapps_audio_chat      wdnapps_audio_chat
wdnapps_media_generator wdnapps_media_generator

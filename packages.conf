# wdnwebui 的包清单 —— 一行一个包，两列：
#
#   <pip 包名 / 目录名>   <GitHub 仓库名>
#
# 第一列同时是：
#   * clone 到 ~/.wardner/wdnwebui/.venv/src/<第一列>/ 的目录名
#   * pip 装出来的 dist-info 名（wdnapps-video-analyzer 的规范名是连字符，
#     但 site-packages 上实际落的是下划线 —— purge_install_traces 全靠这一列
#     拼 glob，传连字符会让清理静默落空）
#
# 顺序有讲究：SDK 在前，卡片插件在后。
# wdnapps_hdmi_processor 的 usb_hid 卡 import wdnhid / wdnav，
# 先有它们再装插件，日志里的报错才不会指向"还没装的 SDK"这种假线索。
#
# 新增一个包 = 在这里加一行 + 在 GitHub 上建同名仓。

wdnav                   wdnav
wdnai                   wdnai
wdndds                  wdndds
wdnhid                  wdnhid
wdnapps_video_analyzer  wdnapps_video_analyzer
wdnapps_hdmi_processor  wdnapps_hdmi_processor
wdnapps_audio_chat      wdnapps_audio_chat
wdnapps_media_generator wdnapps_media_generator
